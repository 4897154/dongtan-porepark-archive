<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동탄 포레파크 자연앤 푸르지오 공사진행 아카이브</title>
<style>
:root{color-scheme:light}
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:1000px;margin:40px auto;padding:0 18px;line-height:1.55;color:#182033}
h1{font-size:24px;line-height:1.3}
.bar,.viewbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0}
button,select{padding:10px 13px;font-size:15px;border:1px solid #cbd2df;border-radius:8px;background:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.active{background:#153c8a;color:#fff;border-color:#153c8a}
a{color:#1649a0}
img{max-width:100%;height:auto;display:block;border:1px solid #e1e5ec;border-radius:6px;margin:0 auto;background:#f5f7fa}
.photo-wrap{background:#f7f8fb;border:1px solid #e8ebf1;border-radius:12px;padding:12px;min-height:220px}
.meta{color:#5a6475;font-size:14px;margin:12px 0}
.note{background:#f5f7fb;padding:12px 14px;border-radius:8px;color:#48546a}
#photo{width:100%}
@media(max-width:600px){body{margin:22px auto}h1{font-size:21px}.photo-wrap{padding:6px}}
</style>
</head>
<body>
<h1>동탄 포레파크 자연앤 푸르지오 공사진행 아카이브</h1>
<div class="note">월별 공사현황을 최신순으로 확인하거나, GIF 타임랩스로 공사 진행 과정을 한 번에 볼 수 있습니다.</div>

<div class="viewbar" role="group" aria-label="보기 방식">
  <button id="showMonth" class="active" type="button">월별 사진</button>
  <button id="showTimeline" type="button">▶ 변천사 GIF 재생</button>
  <a id="source" target="_blank" rel="noopener">공식 원문 보기</a>
</div>

<div id="monthControls" class="bar">
  <label for="month">기준월</label>
  <select id="month"></select>
  <button id="older" type="button">← 더 오래된 사진</button>
  <button id="newer" type="button">더 최신 사진 →</button>
</div>
<div id="meta" class="meta" aria-live="polite"></div>
<div class="photo-wrap">
  <img id="photo" alt="동탄 포레파크 자연앤 푸르지오 공사진행 사진">
</div>
<div id="gifHelp" class="meta" hidden>과거 사진부터 최신 사진까지 자동으로 재생합니다. <a href="images/timelapse.gif" target="_blank" rel="noopener">GIF 원본을 새 탭에서 열기</a></div>

<script>
let data=[];
let i=0;
let viewMode='month';
const photo=document.getElementById('photo');
const source=document.getElementById('source');
const meta=document.getElementById('meta');
const monthControls=document.getElementById('monthControls');
const showMonth=document.getElementById('showMonth');
const showTimeline=document.getElementById('showTimeline');

async function load(){
  const r=await fetch('archive.json?'+Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('archive.json을 불러오지 못했습니다.');
  data=await r.json();
  // Newest-first: the latest record is selected on the first page load.
  data.sort((a,b)=>b.month.localeCompare(a.month));
  const s=document.getElementById('month');
  s.innerHTML='';
  data.forEach((x,n)=>{const o=document.createElement('option');o.value=n;o.textContent=x.month;s.appendChild(o)});
  s.onchange=()=>{i=+s.value;setMode('month')};
  document.getElementById('older').onclick=()=>{if(i<data.length-1){i++;renderMonth()}};
  document.getElementById('newer').onclick=()=>{if(i>0){i--;renderMonth()}};
  showMonth.onclick=()=>setMode('month');
  showTimeline.onclick=()=>setMode('timeline');
  setMode('month');
}
function setMode(mode){
  viewMode=mode;
  showMonth.classList.toggle('active', mode==='month');
  showTimeline.classList.toggle('active', mode==='timeline');
  monthControls.hidden=mode==='timeline';
  document.getElementById('gifHelp').hidden=mode!=='timeline';
  if(mode==='timeline'){
    photo.src='images/timelapse.gif?'+Date.now();
    photo.alt='동탄 포레파크 자연앤 푸르지오 공사진행 변천사 애니메이션';
    meta.textContent='변천사 타임랩스 · '+data.length+'개월 · '+data[data.length-1].month+' → '+data[0].month;
    source.href='https://www.prugio.com/construction/construction-view.aspx?Pkey=1077';
    source.style.display='none';
  }else{
    source.style.display='';
    renderMonth();
  }
}
function renderMonth(){
  if(!data.length)return;
  viewMode='month';
  i=Math.max(0,Math.min(i,data.length-1));
  document.getElementById('month').value=String(i);
  const x=data[i];
  photo.src=x.image+'?'+Date.now();
  photo.alt=x.month+' 공사진행 사진';
  meta.textContent='기준월: '+x.month+' · '+(x.description||'');
  source.href=x.sourceUrl;
  document.getElementById('older').disabled=i===data.length-1;
  document.getElementById('newer').disabled=i===0;
  showMonth.classList.add('active');
  showTimeline.classList.remove('active');
  monthControls.hidden=false;
  document.getElementById('gifHelp').hidden=true;
}
photo.addEventListener('error',()=>{
  if(viewMode==='timeline'){
    meta.textContent='GIF를 아직 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
  }else{
    meta.textContent='사진을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
  }
});
load().catch(err=>{meta.textContent=err.message});
</script>
</body>
</html>
