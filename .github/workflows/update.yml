name: Update PRUGIO construction archive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check PRUGIO and save a new month
        id: detect
        run: python scripts/update_archive.py

      - name: Send Gmail notification
        if: steps.detect.outputs.new_image == 'true'
        continue-on-error: true
        env:
          NEW_MONTH: ${{ steps.detect.outputs.month }}
          NEW_IMAGE: ${{ steps.detect.outputs.image }}
          SOURCE_IMAGE_URL: ${{ steps.detect.outputs.source_image_url }}
        shell: bash
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "::warning::A new photo was found, but Gmail Secrets are not configured. Add MAIL_USERNAME, MAIL_PASSWORD, and MAIL_TO under Settings > Secrets and variables > Actions to enable email alerts."
            exit 0
          fi
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["MAIL_USERNAME"].strip()
          password = os.environ["MAIL_PASSWORD"].replace(" ", "").strip()
          recipients = os.environ["MAIL_TO"].strip()
          month = os.environ["NEW_MONTH"]
          image_path = os.environ["NEW_IMAGE"]
          source_image_url = os.environ["SOURCE_IMAGE_URL"]

          msg = EmailMessage()
          msg["Subject"] = f"[동탄 포레파크] {month} 공사사진 업데이트"
          msg["From"] = username
          msg["To"] = recipients
          msg.set_content(
              "동탄 포레파크 자연앤 푸르지오 공사현황 아카이브에 새 사진이 추가되었습니다.\n\n"
              f"기준월: {month}\n"
              f"저장 경로: {image_path}\n"
              "아카이브: https://4897154.github.io/dongtan-porepark-archive/\n"
              f"공식 이미지 원문: {source_image_url}\n"
              "공식 페이지: https://www.prugio.com/construction/construction-view.aspx?Pkey=1077\n"
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(username, password)
              smtp.send_message(msg)

          print("Gmail notification sent.")
          PY

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json images/
          git diff --cached --quiet || git commit -m "Update construction archive"
          git push
