name: Build construction timelapse

on:
  push:
    branches:
      - main
    paths:
      - "archive.json"
      - "index.html"
      - "scripts/create_timelapse.py"
      - ".github/workflows/build-timelapse.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: pip install Pillow
      - name: Generate GIF from archived photos
        run: python scripts/create_timelapse.py
      - name: Commit GIF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/timelapse.gif
          git diff --cached --quiet || git commit -m "Build construction timelapse GIF"
          git push
